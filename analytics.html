<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>FigureNG Analytics</title><style>:root{--g:#12372a;--ink:#14231d;--muted:#69756f;--bg:#f5f7f5;--white:#fff;--line:#dce3df}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 Arial,sans-serif}.wrap{width:min(1180px,calc(100% - 30px));margin:auto}header{background:#fff;border-bottom:1px solid var(--line);padding:16px 0}.head{display:flex;align-items:center;justify-content:space-between;gap:15px}.brand{font-weight:900;font-size:20px}.brand span{color:var(--g)}a{color:var(--g);font-weight:800;text-decoration:none}.tools{display:flex;gap:8px;align-items:center}.tools button,.tools select{border:1px solid var(--line);background:#fff;border-radius:5px;padding:8px 10px;font-weight:800}main{padding:28px 0 60px}h1{margin:0 0 5px;font-size:30px}.muted{color:var(--muted)}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:22px 0}.card{background:#fff;border:1px solid var(--line);border-radius:7px;padding:16px}.stat small{display:block;color:var(--muted);font-size:10px;font-weight:800}.stat strong{display:block;font-size:25px;margin-top:5px}.cols{display:grid;grid-template-columns:1.5fr 1fr;gap:18px}.card h2{font-size:17px;margin:0 0 14px}.row{display:flex;justify-content:space-between;gap:10px;padding:10px 0;border-bottom:1px solid var(--line);font-size:12px}.row:last-child{border-bottom:0}.bar{height:7px;background:#edf1ee;border-radius:20px;margin-top:5px;overflow:hidden}.bar i{display:block;height:100%;background:var(--g)}.empty{color:var(--muted);padding:15px 0}@media(max-width:800px){.grid{grid-template-columns:1fr 1fr}.cols{grid-template-columns:1fr}}@media(max-width:500px){.grid{grid-template-columns:1fr}.head{align-items:flex-start;flex-direction:column}}</style></head><body><header><div class="wrap head"><div class="brand">Figure<span>NG</span> Analytics</div><div class="tools"><select id="days"><option value="7">Last 7 days</option><option value="30" selected>Last 30 days</option><option value="90">Last 90 days</option><option value="365">Last 12 months</option></select><button id="refresh">Refresh</button><a href="/admin.html">Admin</a></div></div></header><main class="wrap"><h1>Website analytics</h1><p class="muted">First-party traffic and usage data collected by FigureNG. No Google Analytics required.</p><div class="grid"><div class="card stat"><small>Page views</small><strong id="views">—</strong></div><div class="card stat"><small>Unique visitors</small><strong id="visitors">—</strong></div><div class="card stat"><small>Sessions</small><strong id="sessions">—</strong></div><div class="card stat"><small>Avg. engagement</small><strong id="engagement">—</strong></div></div><div class="cols"><section class="card"><h2>Most viewed pages</h2><div id="pages" class="empty">Loading...</div></section><section class="card"><h2>Visitors by country</h2><div id="countries" class="empty">Loading...</div></section></div><div class="card" style="margin-top:18px"><h2>Events</h2><div id="events" class="empty">Loading...</div></div></main><script>
const $=id=>document.getElementById(id);function fmt(n){return Number(n||0).toLocaleString()}function duration(ms){const s=Math.round((ms||0)/1000);if(s<60)return s+'s';const m=Math.floor(s/60),r=s%60;return m+'m '+r+'s'}async function load(){const p=new URLSearchParams({days:$('days').value});const pass=prompt('Enter your FigureNG admin password to view analytics.');if(!pass)return;try{const r=await fetch('/api/analytics?'+p,{headers:{'X-Admin-Password':pass}});const j=await r.json();if(!r.ok||!j.success)throw new Error(j.error||'Unable to load analytics');const s=j.summary;$('views').textContent=fmt(s.page_views);$('visitors').textContent=fmt(s.unique_visitors);$('sessions').textContent=fmt(s.sessions);$('engagement').textContent=duration(s.avg_engagement_ms);const max=Math.max(1,...j.top_pages.map(x=>x.views));$('pages').innerHTML=j.top_pages.length?j.top_pages.map(x=>`<div class="row"><div style="min-width:0;flex:1"><b>${escapeHtml(x.title||x.path)}</b><div class="muted">${escapeHtml(x.path)}</div><div class="bar"><i style="width:${Math.round(x.views/max*100)}%"></i></div></div><b>${fmt(x.views)}</b></div>`).join(''):'<div class="empty">No page views yet.</div>';const cv=Math.max(1,...j.countries.map(x=>x.visitors));$('countries').innerHTML=j.countries.length?j.countries.map(x=>`<div class="row"><span>${escapeHtml(x.country)}</span><b>${fmt(x.visitors)}</b></div>`).join(''):'<div class="empty">No country data yet.</div>';$('events').innerHTML=j.events.length?j.events.map(x=>`<div class="row"><span>${escapeHtml(x.event_name)}</span><b>${fmt(x.count)}</b></div>`).join(''):'<div class="empty">No events yet.</div>'}catch(e){alert(e.message)}}function escapeHtml(v){return String(v||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]))}$('refresh').onclick=load;$('days').onchange=load;load();
</script></body></html>
