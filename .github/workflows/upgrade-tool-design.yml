name: Upgrade FigureNG tools

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  upgrade:
    if: "!contains(github.event.head_commit.message, '[skip tool upgrade]')"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Inject shared FigureNG tool design
        shell: python
        run: |
          from pathlib import Path

          files = [
              'public/salary-calculator.html',
              'public/salary-increase-calculator.html',
              'public/loan-calculator.html',
              'public/flat-vs-reducing.html',
              'public/vat-calculator.html',
              'public/fuel-cost-calculator.html',
              'public/electricity-bill-calculator.html',
          ]

          marker = '<link rel="stylesheet" href="/figureng-tool.css">'

          for name in files:
              path = Path(name)
              if not path.exists():
                  continue
              text = path.read_text(encoding='utf-8')
              if marker not in text and '</head>' in text:
                  text = text.replace('</head>', f'  {marker}\n</head>', 1)
                  path.write_text(text, encoding='utf-8')

      - name: Commit upgraded tool pages
        run: |
          git config user.name "FigureNG"
          git config user.email "actions@users.noreply.github.com"
          git add public/*.html
          if git diff --cached --quiet; then
            echo "No tool pages needed updating."
            exit 0
          fi
          git commit -m "Unify existing tools with FigureNG design [skip tool upgrade]"
          git push
