name: Integrate admin insights
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  integrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Inject admin insights script
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('public/admin.html')
          s = p.read_text()
          tag = '<script src="/admin-insights.js"></script>'
          if tag not in s:
              marker = '</body>'
              if marker not in s:
                  raise SystemExit('admin.html has no closing body tag')
              s = s.replace(marker, tag + marker, 1)
              p.write_text(s)
          PY
      - name: Commit integration
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/admin.html
          git diff --cached --quiet && exit 0
          git commit -m 'Integrate analytics and ads into admin panel'
          git push
# Triggered again to apply the UI integration to the existing admin page.
