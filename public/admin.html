<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>FigureNG Admin</title>
<meta name="robots" content="noindex,nofollow">
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#f5f7f5}
#adminFrame{display:block;width:100%;height:100%;height:100dvh;border:0}
</style>
</head>
<body>
<iframe id="adminFrame" src="/admin-original.html" title="FigureNG Admin"></iframe>
<script>
(function(){
  const frame=document.getElementById('adminFrame');
  frame.addEventListener('load',function(){
    try{
      const doc=frame.contentDocument;
      if(!doc||doc.getElementById('fg-admin-insights-loader'))return;
      const s=doc.createElement('script');
      s.id='fg-admin-insights-loader';
      s.src='/admin-insights.js?v=1';
      doc.head.appendChild(s);
    }catch(e){console.error('FigureNG admin integration failed',e)}
  });
})();
</script>
<script src="/admin-insights.js"></script></body>
</html>
