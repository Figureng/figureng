<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>FigureNG Admin</title>
<meta name="robots" content="noindex,nofollow">
<style>
html,body{margin:0;width:100%;height:100%;background:#f5f7f5}
#loading{min-height:100vh;display:grid;place-items:center;font:700 14px Arial,Helvetica,sans-serif;color:#69756f}
iframe{display:block;width:100%;height:100%;min-height:100vh;border:0;background:#f5f7f5}
</style>
</head>
<body>
<div id="loading">Loading FigureNG Admin…</div>
<script>
(async function(){
  try{
    const response=await fetch('/admin-original.html',{cache:'no-store'});
    if(!response.ok) throw new Error('Unable to load the admin panel.');
    let html=await response.text();
    // The original admin preview contains a literal closing script tag inside
    // an inline JavaScript string. Escape it before parsing the HTML so the
    // browser cannot terminate that script element early.
    html=html.replace(/<\/script>/gi,'<\\/script>');
    const marker='<script src="/admin-insights.js"></script></body>';
    const closeScript='</'+'script>';
    const insights='<script src="/admin-insights.js?v=3">'+closeScript;
    html=html.replace(/<\/body>/i,insights+'</body>');
    const frame=document.createElement('iframe');
    frame.title='FigureNG Admin';
    frame.srcdoc=html;
    frame.onload=()=>{const loading=document.getElementById('loading');if(loading)loading.remove()};
    document.body.appendChild(frame);
  }catch(error){
    const loading=document.getElementById('loading');
    if(loading)loading.textContent=error.message||'Unable to load the admin panel.';
  }
})();
</script>
</body>
</html>
