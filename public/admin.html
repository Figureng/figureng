<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>FigureNG Admin</title>
<meta name="robots" content="noindex,nofollow">
<style>
html,body{margin:0;width:100%;height:100%;background:#f5f7f5}
#loading{min-height:100vh;display:grid;place-items:center;font:700 14px Arial,Helvetica,sans-serif;color:#69756f}
</style>
</head>
<body>
<div id="loading">Loading FigureNG Admin…</div>
<script>
(async function(){
  try{
    const response=await fetch('/admin-original.html',{cache:'no-store'});
    if(!response.ok) throw new Error('Unable to load the admin panel.');
    let html=await response.text();
    if(!html.toLowerCase().includes('admin-insights.js')){
      html=html.replace(/<\/body>/i,'<script src="/admin-insights.js?v=2"><\\/script></body>');
    }
    document.open();
    document.write(html);
    document.close();
  }catch(error){
    document.getElementById('loading').textContent=error.message||'Unable to load the admin panel.';
  }
})();
</script>
</body>
</html>
