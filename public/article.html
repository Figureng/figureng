<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FigureNG Guide</title><meta id="metaDescription" name="description" content="FigureNG practical guides for Nigerians."><meta name="robots" content="index,follow"><link rel="icon" href="/favicon.svg"><style>
:root{--g:#12372a;--g2:#1b513d;--gl:#edf5f0;--ink:#14231d;--muted:#69756f;--bg:#f5f7f5;--white:#fff;--line:#dce3df;--max:1100px}*{box-sizing:border-box;margin:0;padding:0}body{background:var(--bg);color:var(--ink);font-family:Arial,Helvetica,sans-serif;line-height:1.75}a{text-decoration:none;color:inherit}.container{width:min(var(--max),calc(100% - 30px));margin:auto}header{position:sticky;top:0;z-index:10;background:rgba(255,255,255,.97);border-bottom:1px solid var(--line)}.head{min-height:66px;display:flex;align-items:center;justify-content:space-between}.brand{display:flex;align-items:center;gap:9px;font-size:20px;font-weight:900}.mark{width:30px;height:30px;display:grid;place-items:center;background:var(--g);color:#fff;border-radius:5px;font-size:11px}.brand span{color:var(--g2)}nav{display:flex;gap:20px}nav a{font-size:12px;font-weight:800;color:var(--muted)}nav a:hover{color:var(--g)}main{padding:55px 0 80px}.article{width:min(790px,100%);margin:auto}.category{display:inline-block;background:var(--gl);color:var(--g2);padding:5px 8px;border-radius:4px;font-size:9px;font-weight:900;letter-spacing:.08em;text-transform:uppercase;margin-bottom:14px}.title{font-size:clamp(32px,5vw,52px);line-height:1.1;letter-spacing:-1.8px;margin-bottom:15px}.excerpt{font-size:17px;color:var(--muted);line-height:1.65;margin-bottom:14px}.date{font-size:10px;color:#89938e;margin-bottom:28px}.hero{width:100%;max-height:430px;object-fit:cover;border-radius:7px;margin-bottom:30px;border:1px solid var(--line)}.content{font-size:16px}.content p{margin:0 0 18px}.content h2{font-size:27px;line-height:1.25;margin:32px 0 12px}.content h3{font-size:21px;line-height:1.3;margin:26px 0 10px}.content strong,.content b{font-weight:800}.content ul,.content ol{padding-left:25px;margin:0 0 20px}.content li{margin:5px 0}.content blockquote{margin:22px 0;padding:15px 18px;border-left:4px solid var(--g2);background:var(--gl);color:#3f5047}.content img{display:block;max-width:100%;height:auto;border-radius:6px;margin:18px 0}.content a{color:var(--g2);text-decoration:underline;font-weight:700}.back{display:inline-block;margin-top:30px;color:var(--g2);font-size:11px;font-weight:900}.loading,.error{text-align:center;color:var(--muted);padding:70px 10px}.footer{background:var(--g);color:#fff;padding:30px 0}.footer p{color:#c9dbd1;font-size:11px}@media(max-width:600px){nav{gap:10px}nav a{font-size:10px}main{padding-top:40px}.content{font-size:15px}.title{font-size:37px}}
</style></head><body><header><div class="container head"><a class="brand" href="/"><span class="mark">FG</span>Figure<span>NG</span></a><nav id="nav"><a href="/tools.html">Tools</a><a href="/guides.html">Guides</a><a href="/about.html">About</a></nav></div></header><main><div id="app" class="container"><div class="loading">Loading guide...</div></div></main><footer class="footer"><div class="container"><p>© 2026 FigureNG. Practical tools and information for Nigeria.</p></div></footer><script>
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));
const cleanHtml=v=>String(v||'').replace(/<script[\s\S]*?<\/script>/gi,'').replace(/\son\w+\s*=\s*(["']).*?\1/gi,'').replace(/javascript:/gi,'');
(async function(){const slug=new URLSearchParams(location.search).get('slug');if(!slug){$('app').innerHTML='<div class="error">Guide not found.</div>';return}try{const [ar,cr]=await Promise.all([fetch('/api/articles?slug='+encodeURIComponent(slug)),fetch('/api/site-config')]);const d=await ar.json();if(!ar.ok||!d.article)throw Error('Guide not found.');const a=d.article;document.title=(a.seo_title||a.title)+' | FigureNG';document.getElementById('metaDescription').content=a.meta_description||a.excerpt||a.title;const nav=document.getElementById('nav');if(cr.ok){const c=await cr.json();const items=(c.settings&&Array.isArray(c.settings.nav_items))?c.settings.nav_items:[];if(items.length)nav.innerHTML=items.filter(x=>x.enabled!==false).map(x=>'<a href="'+esc(x.url)+'">'+esc(x.label)+'</a>').join('')}document.getElementById('app').innerHTML='<article class="article"><div class="category">'+esc(a.category||'Guides')+'</div><h1 class="title">'+esc(a.title)+'</h1><p class="excerpt">'+esc(a.excerpt||'')+'</p><div class="date">Published '+esc(new Date(a.published_at||a.created_at).toLocaleDateString('en-NG',{day:'numeric',month:'long',year:'numeric'}))+'</div>'+(a.featured_image?'<img class="hero" src="'+esc(a.featured_image)+'" alt="'+esc(a.title)+'">':'')+'<div class="content">'+cleanHtml(a.content)+'</div><a class="back" href="/guides.html">← Back to guides</a></article>'}catch(e){document.getElementById('app').innerHTML='<div class="error">'+esc(e.message||'Unable to load this guide.')+'</div>'}})();
function $(id){return document.getElementById(id)}
</script></body></html>
